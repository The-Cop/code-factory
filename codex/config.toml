model = "gpt-5.5"
plan_mode_reasoning_effort = "xhigh"
model_reasoning_effort = "xhigh"

# Default-allow Codex execution posture managed by code-factory.
approval_policy = "never"
[sandbox]
enabled = false
allowUnsandboxedCommands = true
# [sandbox_workspace_write]
# network_access = true
# writable_roots = [
#   "/Users/rodrigo.fernandes/docs",
#   "/Users/rodrigo.fernandes/dev",
#   "/Users/rodrigo.fernandes/dd",
#   "/Users/rodrigo.fernandes/go",
#   "/Users/rodrigo.fernandes/Downloads",
#   "/tmp",
#   "/private/tmp",
#   "/private/var/tmp",
# ]

default_permissions = "read-all-write-selected"

[permissions.read-all-write-selected.filesystem]
":root" = "read"
"/Users/rodrigo.fernandes/.aws" = "deny"
"/Users/rodrigo.fernandes/.config/gh" = "deny"
"/Users/rodrigo.fernandes/.ssh" = "deny"
"/Users/rodrigo.fernandes/.ssh/known_hosts" = "read"

[permissions.read-all-write-selected.workspace_roots]
"/Users/rodrigo.fernandes/docs" = true
"/Users/rodrigo.fernandes/dev" = true
"/Users/rodrigo.fernandes/dd" = true
"/Users/rodrigo.fernandes/go" = true
"/Users/rodrigo.fernandes/Downloads" = true
"/tmp" = true
"/private/tmp" = true
"/private/var/tmp" = true

[permissions.read-all-write-selected.filesystem.":workspace_roots"]
"." = "write"

[permissions.read-all-write-selected.network]
enabled = true

[permissions.read-all-write-selected.network.domains]
"*" = "allow"

[projects."/Users/rodrigo.fernandes/dev"]
trust_level = "trusted"

[projects."/Users/rodrigo.fernandes/dd"]
trust_level = "trusted"
